# INFRASTRUCTURE 
# Adresses IP des machines virtuelles
# DÉTECTION AUTOMATIQUE VIA VMIUT
detect_ip() {
    local vm_target=$1
    if command -v vmiut &> /dev/null; then
        # On cherche l'IP principale (en 10.42.x.x ou autre selon votre réseau réel)
        # On prend la première IP trouvée dans la sortie de vmiut
        vmiut info "$vm_target" 2>/dev/null | grep -oE "[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+" | grep -v "127.0.0.1" | head -n 1 || true
    fi
}

echo "Détection automatique des IPs" >&2
IP_PROXY=$(detect_ip "proxy")
IP_DOLIBARR=$(detect_ip "dolibarr")
IP_DATABASE=$(detect_ip "database")
IP_BACKUP=$(detect_ip "backup")

# Vérification
if [ -z "$IP_PROXY" ] || [ -z "$IP_DOLIBARR" ] || [ -z "$IP_DATABASE" ] || [ -z "$IP_BACKUP" ]; then
    echo "Impossible de détecter toutes les IPs automatiquement." >&2
    echo "Assurez-vous que les VMs (proxy, dolibarr, database, backup) sont démarrées." >&2
    # Valeurs de secours (ou laisser vide pour faire échouer les scripts si critique)
fi

# Utilisateur SSH (commun à toutes les VMs)
export VM_USER="user"
# Mot de passe SSH (pour l'installation initiale des clés SSH seulement)
export VM_PASSWORD="user"

# Domaine de base
export DOMAIN_BASE="dattier.iutinfo.fr"

# toolbox 
# Exécuter une commande sudo sur une VM distante sans prompt interactif
run_remote_sudo() {
    local host="$1"
    local cmd="$2"
    ssh "$VM_USER@$host" "echo '$VM_PASSWORD' | sudo -S -p '' bash -c '$cmd'"
}

